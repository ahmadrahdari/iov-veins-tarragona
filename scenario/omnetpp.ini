[General]
network = TarragonaAka
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 60s
**.cmdenv-log-level = off
sim-time-limit = 150s
repeat = 3
seed-set = ${repetition}
output-scalar-file = ${resultdir}/${configname}-N${N}-r${repetition}.sca
output-vector-file = ${resultdir}/${configname}-N${N}-r${repetition}.vec
**.scalar-recording = true
**.vector-recording = false

*.playgroundSizeX = 3700m
*.playgroundSizeY = 2000m
*.playgroundSizeZ = 50m

*.annotations.draw = false
*.obstacles.obstacles = xmldoc("config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']/obstacles")

# ---------------- TraCI / SUMO (Tarragona city centre) ----------------
*.manager.updateInterval = 0.1s
*.manager.port = -1
*.manager.command = "sumo"
*.manager.configFile = "tarragona_N${N=20,40,60,80,100,120}.sumo.cfg"
*.manager.seed = ${repetition}
*.manager.autoShutdown = true
*.manager.moduleType = "org.car2x.veins.nodes.Car"

# ---------------- fog nodes / RSUs (OMNeT++ coordinates) ----------------
*.numRsu = 4
*.backhaulDelay = 10ms
# Placa de la Imperial Tarraco
*.rsu[0].mobility.x = 1749
*.rsu[0].mobility.y = 997
# Rambla Vella / Rambla Nova (east)
*.rsu[1].mobility.x = 2675
*.rsu[1].mobility.y = 1356
# Avinguda de Ramon y Cajal / Avinguda de Roma (west)
*.rsu[2].mobility.x = 975
*.rsu[2].mobility.y = 1356
# Avinguda de Catalunya (north)
*.rsu[3].mobility.x = 2098
*.rsu[3].mobility.y = 717
*.rsu[*].mobility.z = 6
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m
*.rsu[*].appl.headerLength = 80 bit
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.dataOnSch = false
*.rsu[*].appl.dataLengthBits = 0 bit
*.rsu[*].appl.advInterval = 0.5s

# ---------------- IEEE 802.11p PHY / MAC ----------------
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false
*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.mac1609_4.useAcks = false
*.**.nic.phy80211p.minPowerLevel = -110dBm
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm
*.**.nic.phy80211p.decider = xmldoc("config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml")
*.**.nic.phy80211p.usePropagationDelay = true
*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")

# ---------------- vehicles ----------------
*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m
*.node[*].applType = "org.car2x.veins.modules.application.aka.AkaVehicleApp"
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.dataOnSch = false
*.node[*].appl.dataLengthBits = 0 bit
# V2V cooperative awareness beacons (10 Hz, 250 bytes)
*.node[*].appl.sendBeacons = true
*.node[*].appl.beaconInterval = 0.1s
*.node[*].appl.beaconLengthBits = 2000 bit
*.node[*].appl.authInterval = 2s
*.node[*].appl.phaseAValidity = 20s
*.node[*].appl.sessionTimeout = 1s
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false

# ---------------- protocol parameters ----------------
# Message sizes in bits (|ID| = 64, |h| = 160, |point| = 320, |T| = 32);
# computation delays from the operation counts of each scheme and the execution times
# measured with ../bench/bench.c on one machine (OpenSSL 3.0.13, secp160r1, SHA-1, AES-128;
# Tpm = 0.1717 ms, Tpa = 0.00042 ms, Th = 0.00052 ms, Tsed = 0.00060 ms, Tmm = 0.00028 ms),
# with polynomial degrees t_x = 1000 and t_y = 100.

# FogRoam: phase A (cloud-assisted) + phase B (cloud-free handover)
[Config Proposed]
*.node[*].appl.useHandover = true
*.node[*].appl.m1Bits = 736
*.node[*].appl.m5Bits = 576
*.node[*].appl.cV1 = 0.3757ms
*.node[*].appl.cV2 = 0.1733ms
*.node[*].appl.cH1 = 0.3736ms
*.node[*].appl.cH2 = 0.1727ms
*.rsu[*].appl.m2Bits = 960
*.rsu[*].appl.m4Bits = 672
*.rsu[*].appl.m6Bits = 512
*.rsu[*].appl.cF1 = 0.7984ms
*.rsu[*].appl.cF2 = 0.1738ms
*.rsu[*].appl.cFH = 0.7983ms
*.cloud.m3Bits = 672
*.cloud.cCS = 0.6910ms

# FogRoam restricted to phase A (every authentication through the cloud)
[Config ProposedA]
extends = Proposed
*.node[*].appl.useHandover = false

# baseline: the protocol of Chen et al. analysed in the paper (ref. [11]); every authentication is a full four-message run
[Config Baseline]
*.node[*].appl.useHandover = false
*.node[*].appl.m1Bits = 672
*.node[*].appl.cV1 = 0.3444ms
*.node[*].appl.cV2 = 0.0010ms
*.rsu[*].appl.m2Bits = 672
*.rsu[*].appl.m4Bits = 352
*.rsu[*].appl.cF1 = 0.1743ms
*.rsu[*].appl.cF2 = 0.0026ms
*.cloud.m3Bits = 352
*.cloud.cCS = 0.0042ms

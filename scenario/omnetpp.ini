# FogRoam over 5G NR (Simu5G 1.2.2 / INET 4.5.2 / Veins 5.3.1 / SUMO 1.20.0)
[General]
network = fogroam5g.Tarragona5G
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 60s
**.cmdenv-log-level = off
print-undisposed = false
sim-time-limit = 900s
repeat = 3
seed-set = ${repetition}

output-scalar-file = ${resultdir}/${configname}-N${N}-r${repetition}.sca
output-vector-file = ${resultdir}/${configname}-N${N}-r${repetition}.vec
# recorded: the scalars of the protocol applications and a few radio KPIs
**.app[*].aka*.scalar-recording = true
**.rcvdSinrUl:mean.scalar-recording = true
**.rcvdSinrDl:mean.scalar-recording = true
**.averageCqiUl:mean.scalar-recording = true
**.averageCqiDl:mean.scalar-recording = true
**.harqErrorRateUl:mean.scalar-recording = true
**.harqErrorRateDl:mean.scalar-recording = true
**.harqErrorRate_1st_Ul:mean.scalar-recording = true
**.harqErrorRate_1st_Dl:mean.scalar-recording = true
**.macPacketLossUl:mean.scalar-recording = true
**.macPacketLossDl:mean.scalar-recording = true
**.macCellPacketLossUl:mean.scalar-recording = true
**.macCellPacketLossDl:mean.scalar-recording = true
**.cellBlocksUtilizationUl:mean.scalar-recording = true
**.cellBlocksUtilizationDl:mean.scalar-recording = true
**.scalar-recording = false
**.param-recording = false
**.vector-recording = false
**.bin-recording = false
**.routingRecorder.enabled = false

*.configurator.config = xmldoc("addresses.xml")
*.playgroundSizeX = 3700m
*.playgroundSizeY = 2000m
*.playgroundSizeZ = 50m

################ road traffic (SUMO through veins_inet) ################
*.veinsManager.updateInterval = 0.1s
*.veinsManager.port = -1
*.veinsManager.command = "sumo"
*.veinsManager.configFile = "tarragona_N${N=20,40,60,80,100,120}.sumo.cfg"
*.veinsManager.seed = ${repetition}
*.veinsManager.autoShutdown = true
*.veinsManager.moduleType = "simu5g.nodes.cars.NRCar"
*.veinsManager.moduleName = "car"
*.car[*].mobility.typename = "VeinsInetMobility"

################ 5G NR radio access ################
# one NR FDD carrier in band n1 (2.1 GHz), 30 kHz subcarrier spacing (numerology 1, 0.5 ms slots),
# 20 MHz = 51 resource blocks in each direction
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2.1GHz
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1
*.carrierAggregation.componentCarrier[0].numBands = 51
**.numBands = 51
**.ueTxPower = 23
**.eNodeBTxPower = 46
# 3GPP TR 38.901 urban macro-cell (UMa) channel: distance-dependent LOS probability,
# log-normal shadowing, Jakes fast fading and inter-cell interference in both directions
**.channelModel[*].scenario = "URBAN_MACROCELL"
**.nrChannelModel[*].scenario = "URBAN_MACROCELL"
**.dynamic_los = true
**.shadowing = true
**.fading = true
**.downlink_interference = true
**.uplink_interference = true
# vehicle UE as in 3GPP TR 37.885: roof-top antenna with 3 dBi gain, 9 dB noise figure
**.antennaGainUe = 3
**.ue_noise_figure = 9
**.bs_noise_figure = 5
# link adaptation (values used by the Simu5G NR scenarios), CSI report every 40 ms
**.targetBler = 0.01
**.blerShift = 5
**.fbPeriod = 40
# proportional-fair scheduling in both directions
**.schedulingDisciplineDl = "PF"
**.schedulingDisciplineUl = "PF"
# RLC UM reassembly timer (t-Reassembly, TS 38.331); the Simu5G default of 1 s would stall
# the uplink for up to 1 s after every residual HARQ failure
**.rlc.**.timeout = 50ms
**.nrRlc.**.timeout = 50ms

# gNBs at the four fog sites
*.numFog = 4
*.gnb[*].mobility.initFromDisplayString = false
*.gnb[0].mobility.initialX = 1749m
*.gnb[0].mobility.initialY = 997m
*.gnb[1].mobility.initialX = 2675m
*.gnb[1].mobility.initialY = 1356m
*.gnb[2].mobility.initialX = 975m
*.gnb[2].mobility.initialY = 1356m
*.gnb[3].mobility.initialX = 2098m
*.gnb[3].mobility.initialY = 717m
*.gnb[*].mobility.initialZ = 0m
*.gnb[*].macNodeId = 1 + ancestorIndex(0)
*.gnb[*].macCellId = 1 + ancestorIndex(0)

# standalone NR: vehicles attach to the strongest gNB and hand over between gNBs
*.car[*].masterId = 0
*.car[*].macCellId = 0
*.car[*].nrMasterId = 1
*.car[*].nrMacCellId = 1
*.car[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.car[*].cellularNic.nrPhy.enableHandover = true
*.gnb[*].cellularNic.phy.enableHandover = true
*.gnb[*].cellularNic.phy.handoverLatency = 50ms
*.gnb[*].cellInfo.broadcastMessageInterval = 1s

# X2 full mesh between the gNBs
*.gnb[*].numX2Apps = 3
*.gnb[*].x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.gnb[0].x2App[0].client.connectAddress = "gnb[1]%x2ppp0"
*.gnb[0].x2App[1].client.connectAddress = "gnb[2]%x2ppp0"
*.gnb[0].x2App[2].client.connectAddress = "gnb[3]%x2ppp0"
*.gnb[1].x2App[0].client.connectAddress = "gnb[0]%x2ppp0"
*.gnb[1].x2App[1].client.connectAddress = "gnb[2]%x2ppp1"
*.gnb[1].x2App[2].client.connectAddress = "gnb[3]%x2ppp1"
*.gnb[2].x2App[0].client.connectAddress = "gnb[0]%x2ppp1"
*.gnb[2].x2App[1].client.connectAddress = "gnb[1]%x2ppp1"
*.gnb[2].x2App[2].client.connectAddress = "gnb[3]%x2ppp2"
*.gnb[3].x2App[0].client.connectAddress = "gnb[0]%x2ppp2"
*.gnb[3].x2App[1].client.connectAddress = "gnb[1]%x2ppp2"
*.gnb[3].x2App[2].client.connectAddress = "gnb[2]%x2ppp2"
**.sctp.nagleEnabled = false
**.sctp.enableHeartbeats = false

################ protocol applications ################
*.car[*].numApps = 1
*.car[*].app[0].typename = "fogroam5g.AkaVehicleApp5G"
*.fog[*].numApps = 1
*.fog[*].app[0].typename = "fogroam5g.AkaFogApp5G"
*.cloud.numApps = 1
*.cloud.app[0].typename = "fogroam5g.AkaCloudApp5G"

*.car[*].app[0].authInterval = 30s
*.car[*].app[0].authJitter = 7.5s
*.car[*].app[0].phaseAValidity = 300s
*.car[*].app[0].sessionTimeout = 1s
*.car[*].app[0].camInterval = 0.1s
*.car[*].app[0].camBits = 2000
**.app[0].measureStart = 300s
**.app[0].measureEnd = 898s

# FogRoam: phase A when joining / every 300 s, phase B otherwise
[Config Proposed]
*.car[*].app[0].useHandover = true
*.car[*].app[0].edgeEntryHandover = true
*.car[*].app[0].m1Bits = 736
*.car[*].app[0].m5Bits = 576
*.car[*].app[0].cV1 = 0.4054ms
*.car[*].app[0].cV2 = 0.1868ms
*.car[*].app[0].cH1 = 0.4031ms
*.car[*].app[0].cH2 = 0.1863ms
*.fog[*].app[0].m2Bits = 960
*.fog[*].app[0].m4Bits = 512
*.fog[*].app[0].m6Bits = 512
*.fog[*].app[0].cF1 = 0.8637ms
*.fog[*].app[0].cF2 = 0.1873ms
*.fog[*].app[0].cFH = 0.8636ms
*.cloud.app[0].m3Bits = 672
*.cloud.app[0].cCS = 0.7451ms

# FogRoam restricted to phase A (every authentication through the cloud)
[Config ProposedA]
extends = Proposed
*.car[*].app[0].useHandover = false

# Baseline: the protocol of Chen et al. (four messages through the cloud)
[Config Baseline]
*.car[*].app[0].useHandover = false
*.car[*].app[0].m1Bits = 672
*.car[*].app[0].cV1 = 0.3714ms
*.car[*].app[0].cV2 = 0.0011ms
*.fog[*].app[0].m2Bits = 672
*.fog[*].app[0].m4Bits = 352
*.fog[*].app[0].cF1 = 0.1879ms
*.fog[*].app[0].cF2 = 0.0027ms
*.cloud.app[0].m3Bits = 352
*.cloud.app[0].cCS = 0.0043ms
